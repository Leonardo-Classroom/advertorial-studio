<div class="card draft-revise" data-render="ai">
  <h2 style="margin-top:0">要改哪裡？</h2>
  <p class="small muted">寫下想調整的地方，系統會依你的意見重寫一版。原本的版本都會留著。</p>
  <form method="post" action="{% url 'portal:draft_revise' run.pk %}">
    {% csrf_token %}
    <textarea name="feedback"
              placeholder="例如：第二段太像官方新聞稿，改得更口語一點；標題想強調價格。"></textarea>
    {% if versions|length > 1 %}
    <div class="row tight" style="margin-top:12px;flex:0 0 auto">
      <label class="small muted" for="rev_base">根據版本更新</label>
      <select id="rev_base" name="base_version" style="width:auto">
        {% for ver in versions %}
          <option value="{{ ver.version }}" {% if ver.pk == viewing.pk %}selected{% endif %}>{{ ver.label }}{% if forloop.first %}（最新）{% endif %}</option>
        {% endfor %}
      </select>
      <span class="small muted">改動會套在這一版上，存成新的一版。</span>
    </div>
    {% else %}
      <input type="hidden" name="base_version" value="{{ viewing.version }}">
    {% endif %}
    <button class="btn" style="margin-top:12px">依意見重寫</button>
    <span class="small muted" style="margin-left:8px">重寫需 1–2 分鐘，會在背景進行。</span>
  </form>
</div>
