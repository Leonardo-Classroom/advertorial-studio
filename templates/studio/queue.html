{% extends "base.html" %}
{% block content %}
<h1>隊列</h1>
<p class="sub">現在機器在做什麼，以及誰在後面等。這一頁每秒自動更新。</p>

<div id="queue-body">{% include "studio/_queue_body.html" %}</div>

<script>
// Refresh once a second by replacing the changing part, not by reloading the
// page: a full reload at this rate flickers, loses scroll position, and
// re-fetches the stylesheet and nav every time. The server renders the same
// fragment it embedded above, so there is one definition of these tables.
(function () {
  const box = document.getElementById('queue-body');
  if (!box || !window.fetch) return;
  let inFlight = false;

  async function tick() {
    // Skip while hidden — a forgotten tab should not poll all day — and while
    // a previous request is still out, so a slow response cannot pile up.
    if (document.visibilityState !== 'visible' || inFlight) return;
    inFlight = true;
    try {
      const response = await fetch('?fragment=1', {
        headers: {'X-Requested-With': 'fetch'}, credentials: 'same-origin'});
      if (response.ok) box.innerHTML = await response.text();
    } catch (e) {
      // A dropped poll is not worth reporting; the next one is a second away.
    } finally {
      inFlight = false;
    }
  }

  setInterval(tick, 1000);
})();
</script>
{% endblock %}
